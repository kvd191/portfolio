  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Fejléc ---------- */
  .hero {

    color: var(--white);
    background-color: #0a6170;

  .masthead {
    display: flex;

    gap: 16px;
    padding: 22px 0;

  .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--white); }
  .logo-mark { background: var(--white); padding: 6px 8px; display: flex; }
  .logo-mark svg { width: 66px; height: 22px; display: block; }
  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-name { font-size: 22px; font-weight: 700; letter-spacing: 0.32em; }
  .logo-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.34em; color: var(--cyan-100); }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; }
  .meta-link {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cyan-100);
    text-decoration: none;
    border: 1px solid rgba(163, 227, 237, 0.5);
    padding: 7px 14px;
  }
  .meta-link:hover { background: var(--cyan-100); color: var(--petrol-900); }

  .hero-body { padding: 72px 0 64px; }
  h1 { color: var(--white); font-size: clamp(40px, 6vw, 66px); line-height: 1.02; text-transform: uppercase; font-weight: 200; }
  h1 b { font-weight: 700; }
  .lead { margin-top: 20px; max-width: 560px; font-size: 18px; font-weight: 300; color: #cde7ec; }

  /* ---------- Szűrők ---------- */
  .filters-bar { background: var(--surface-alt); border-bottom: 1px solid #d3e2e6; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 34px; padding: 18px 24px; }
  .filter-btn {
    font-family: var(--font);
    font-size: 19px;
    text-transform: uppercase;
    font-weight: 300;
    color: var(--petrol-700);

  .filter-count { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }

  /* ---------- Kártyák ---------- */
  .grid {
    display: grid;

  .card {

  .frame { position: relative; aspect-ratio: 16 / 10; background: #01273a; }

  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  .card-cat { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan-100); }
  .card h3 { font-size: 20px; font-weight: 600; line-height: 1.25; }
  .card p { font-size: 15px; font-weight: 300; color: #d6ecf0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-100);
    border: 1px solid rgba(163, 227, 237, 0.4);
    padding: 1px 8px;
  }
  .card-foot { margin-top: auto; padding-top: 14px; }
  .open-link {
    display: inline-flex; align-items: center; gap: 12px;
    color: var(--white); text-decoration: none;
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .sq {
    width: 30px; height: 30px; border: 1px solid var(--cyan-100); color: var(--cyan-100);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sq svg { width: 14px; height: 14px; }
  .open-link:hover .sq { background: var(--cyan-100); color: var(--petrol-900); }
  .empty { grid-column: 1 / -1; color: var(--muted); }

  /* ---------- Számok ---------- */
  .stats-bar { background: var(--white); border-top: 1px solid var(--surface-alt); }
  .stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 28px 48px; padding: 44px 24px; }

  .stat-num { font-size: clamp(32px, 3.4vw, 44px); font-weight: 200; line-height: 1.05; color: var(--brand-text); white-space: nowrap; }

  .stat-label { margin-top: 10px; font-size: 15px; line-height: 1.4; color: var(--muted); max-width: 240px; }

  /* ---------- Lábléc ---------- */
  footer { background: var(--anthracite-700); color: var(--white); }

  .foot-role { margin-top: 4px; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-100); }

  .foot-bottom {

  }

  @media (max-width: 640px) {
    .hero-body { padding: 48px 0 40px; }
    .grid { grid-template-columns: 1fr; }
    .foot-name { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

/* ============================================================

             pontosan egy szűrő alatt jelenik meg

   ============================================================ */
const reports = [

/* ============================================================
   3. MEGJELENÍTÉS  (ez alá már nem kell nyúlnod)
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="8 7 17 7 17 16"></polyline></svg>`;
const isExternal = u => /^https?:/.test(u);

document.getElementById("lead").textContent = profile.lead;
const linkHtml = cls => profile.links.map(l =>
  `<a class="${cls}" href="${esc(l.url)}"${isExternal(l.url) ? ' target="_blank" rel="noopener"' : ""}>${esc(l.label)}</a>`).join("");
document.getElementById("meta").innerHTML = linkHtml("meta-link");
document.getElementById("foot-links").innerHTML = linkHtml("");
document.getElementById("foot-left").textContent = profile.footerLeft;
document.getElementById("foot-right").textContent = profile.footerRight;
document.getElementById("stats").innerHTML = profile.stats.map(s =>
  `<div><div class="stat-num${s.highlight ? " hl" : ""}">${esc(s.num)}</div><div class="stat-label">${esc(s.label)}</div></div>`).join("");

const gridEl = document.getElementById("grid");
function renderCards(filter) {
  const list = filter === "Mind" ? reports : reports.filter(r => r.category === filter);
  if (!list.length) {
    gridEl.innerHTML = `<p class="empty">Ehhez a témához még nincs riport. Válassz másik témát a fenti sávban.</p>`;
    return;
  }
  gridEl.innerHTML = list.map(r => {
    const frame = r.embed
      ? `<iframe src="${esc(r.embed)}" title="${esc(r.title)}" allowfullscreen loading="lazy"></iframe>`
      : `<div class="placeholder">Illeszd be az embed URL-t (reports[].embed)</div>`;
    const open = r.embed
      ? `<a class="open-link" href="${esc(r.embed)}" target="_blank" rel="noopener">Megnyitás új lapon <span class="sq">${arrow}</span></a>`
      : "";
    const tags = (r.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
    return `
      <article class="card${r.featured ? " featured" : ""}">
        <div class="frame">${frame}</div>
        <div class="card-body">
          <div class="card-top"><span class="card-date">${esc(r.date)}</span><span class="card-cat">${esc(r.category)}</span></div>
          <h3>${esc(r.title)}</h3>
          <p>${esc(r.description)}</p>
          ${tags ? `<div class="tags">${tags}</div>` : ""}
          <div class="card-foot">${open}</div>
        </div>
      </article>`;
  }).join("");
}

/* Szűrősáv: témák, a riportok darabszámával */
const cats = [...new Set(reports.map(r => r.category))];
const filtersEl = document.getElementById("filters");
[["Mind", reports.length], ...cats.map(c => [c, reports.filter(r => r.category === c).length])].forEach(([name, n], i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "filter-btn" + (i === 0 ? " is-active" : "");
  btn.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  btn.innerHTML = `${esc(name)}<span class="filter-count">${n}</span>`;
  btn.onclick = () => {
    filtersEl.querySelectorAll(".filter-btn").forEach(b => { b.classList.remove("is-active"); b.setAttribute("aria-pressed", "false"); });
    btn.classList.add("is-active");
    btn.setAttribute("aria-pressed", "true");
    renderCards(name);
  };
  filtersEl.appendChild(btn);
});

renderCards("Mind");
</script>
</body>
</html>
